name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede in-flight runs for the same ref so pushes don't pile up on the
# single self-hosted runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/test.yml@main
    with:
      # 164 KB actual — 0.5 MB is ~3x headroom
      zip_budget_mb: '0.5'
      # coverage: true once a JS test suite exists (repo is public — Codecov is viable)
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
